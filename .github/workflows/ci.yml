name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [docs/data/schedule.json]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate sessions.yml and config.yml
        run: npm run validate
      # Fails if the committed issue template differs from a fresh run of the generator.
      - name: Check the issue template is up to date
        run: npm run check:template
      - run: npm test
