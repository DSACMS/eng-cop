# Rebuilds docs/data/schedule.json from sessions.yml, config.yml and the proposal issues,
# then keeps each proposal's label and status comment in step with the result.
#
# Credentials: only the default GITHUB_TOKEN. No GitHub App, no secrets.
# Issue text is never interpolated into a shell command; it is only read through the API.
name: Schedule

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  push:
    # Only the inputs an admin edits. The workflow's own commit touches docs/data/ only,
    # and commits made with GITHUB_TOKEN do not trigger workflows in any case.
    branches: [main]
    paths: [sessions.yml, config.yml]
  schedule:
    - cron: '17 8 * * *' # nightly (04:17 ET): sessions roll from upcoming to past with no human action
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One run at a time, so two events cannot race on the schedule.json commit.
# Every run rebuilds from scratch, so a queued run loses nothing.
concurrency:
  group: schedule
  cancel-in-progress: false

jobs:
  rebuild:
    # Ignore issues that are not talk proposals.
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'talk')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A bad edit fails here, before anything is committed: the site keeps the last good schedule.json.
      - name: Validate sessions.yml and config.yml
        run: npm run validate

      - name: Compile schedule, then update labels and comments
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { runSync } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github-sync.mjs`).href);
            const issueEvent = context.eventName === 'issues';
            await runSync({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              trigger: issueEvent ? { number: context.payload.issue.number, action: context.payload.action } : {},
              log: core.info,
            });

      - name: Commit schedule.json if it changed
        run: |
          if git diff --quiet -- docs/data/schedule.json; then
            echo "schedule.json is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/schedule.json
          git commit -m "chore: rebuild schedule"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Tell the author when their proposal could not be processed because an admin file is invalid.
      - name: Comment on the proposal if the rebuild failed
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: 'The schedule could not be rebuilt just now, so this proposal has not been processed. ' +
                    'An admin needs to fix `sessions.yml` or `config.yml`; see the ' +
                    `[workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). ` +
                    'Your proposal is safe and will be picked up on the next successful run.',
            });
