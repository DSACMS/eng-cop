      required: true
  - type: input
    id: presenter
    attributes:
      label: GitHub username
      description: Who is presenting. Admins filing for someone without an account may write their name here.
      placeholder: your-handle
    validations:
      required: true
  - type: input
    id: talk-title
    attributes:
      label: Talk title
      placeholder: What you'll cover, in a line
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      description: Must be a format open on the date you chose.
      options:
        - Lightning talk (20 min)
        - Presentation (30 min)
        - Full session (50 min)
    validations:
      required: true
  - type: textarea
    id: abstract
    attributes:
      label: Abstract
      placeholder: A few sentences for the agenda.
    validations:
      required: false
