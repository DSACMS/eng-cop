name: Propose a talk
description: Take an open slot at the Engineering CoP. An admin confirms every talk before it joins the agenda.
title: "[Talk] "
labels:
  - talk
body:
  - type: markdown
    attributes:
      value: "Everything on this page is public on GitHub. Use your GitHub username only, with no email addresses. Prefer the schedule site: it fills this form in for you."
